<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyte–Doolittle Hydropathy Scale Calculator</title>
    <script src="https://cdn.plot.ly/plotly-2.26.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            padding: 30px;
        }

        .panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 25px;
            border: 1px solid #e0e0e0;
        }

        .panel h2 {
            color: #667eea;
            font-size: 1.4em;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
            font-size: 0.9em;
        }

        .range-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="range"] {
            flex: 1;
        }

        .range-value {
            min-width: 50px;
            text-align: right;
            font-weight: bold;
            color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        button.secondary {
            background: #e0e0e0;
            color: #333;
        }

        button.secondary:hover {
            background: #d0d0d0;
        }

        .plot-container {
            position: relative;
        }

        #plot {
            width: 100%;
            height: 500px;
        }

        .stats {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            display: none;
        }

        .stats.show {
            display: block;
        }

        .stat-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 12px;
        }

        .stat-item {
            padding: 12px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-value {
            color: #333;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 4px;
            font-family: monospace;
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .help-text {
            color: #666;
            font-size: 0.85em;
            margin-top: 6px;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .stat-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧬 Kyte–Doolittle Hydropathy Scale</h1>
            <p>預測蛋白質疏水性域與跨膜螺旋結構（完全離線版本）</p>
        </header>

        <div class="content">
            <!-- 左側：輸入面板 -->
            <div class="panel">
                <h2>📋 輸入</h2>

                <div class="error" id="error-msg"></div>

                <div class="form-group">
                    <label>蛋白質序列</label>
                    <textarea id="sequence" placeholder="粘貼 FASTA 格式、UniProtKB AC/ID 或直接序列&#10;&#10;例如：&#10;MVLSPADKTNVI&#10;&#10;或：&#10;>sp|P12345|ABC_HUMAN&#10;MVLSPADKTNVI&#10;&#10;或 UniProtKB AC：P12345&#10;或 UniProtKB ID：TP53_HUMAN" required></textarea>
                    <div class="help-text">✓ FASTA 格式 | ✓ 原始序列 | ✓ UniProtKB AC (P12345) | ✓ UniProtKB ID (TP53_HUMAN)</div>
                </div>

                <h2 style="margin-top: 25px;">⚙️ 參數</h2>

                <div class="form-group">
                    <label>Window Size（窗口大小）</label>
                    <div class="range-container">
                        <input type="range" id="windowSize" min="3" max="21" step="2" value="9">
                        <span class="range-value" id="windowSizeValue">9</span>
                    </div>
                    <div class="help-text">奇數 3–21，預設 9</div>
                </div>

                <div class="form-group">
                    <label>邊界權重 (%)（Edge Weight）</label>
                    <div class="range-container">
                        <input type="range" id="edgeWeight" min="0" max="100" step="5" value="100">
                        <span class="range-value" id="edgeWeightValue">100%</span>
                    </div>
                    <div class="help-text">窗口邊界相對權重，預設 100%</div>
                </div>

                <div class="form-group">
                    <label>權重模式（Weight Model）</label>
                    <select id="weightModel">
                        <option value="linear">Linear（線性遞減）</option>
                        <option value="exponential">Exponential（指數遞減）</option>
                    </select>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="normalize">
                    <label for="normalize">正規化結果 (0–1)</label>
                </div>

                <button id="calculateBtn" onclick="calculate()">🔬 計算</button>
                <button id="clearBtn" class="secondary" onclick="clearAll()">🗑️ 清空</button>
            </div>

            <!-- 右側：結果展示 -->
            <div class="plot-container">
                <div id="plot"></div>

                <div class="stats" id="stats">
                    <h3 style="margin-bottom: 15px;">📊 統計資訊</h3>
                    <div class="stat-row">
                        <div class="stat-item">
                            <div class="stat-label">序列長度</div>
                            <div class="stat-value" id="stat-length">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">最小值</div>
                            <div class="stat-value" id="stat-min">-</div>
                        </div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-item">
                            <div class="stat-label">最大值</div>
                            <div class="stat-value" id="stat-max">-</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-label">平均值</div>
                            <div class="stat-value" id="stat-mean">-</div>
                        </div>
                    </div>
                    <div class="stat-row">
                        <div class="stat-item">
                            <div class="stat-label">標準差</div>
                            <div class="stat-value" id="stat-std">-</div>
                        </div>
                    </div>
                </div>

                <button id="downloadCsv" class="secondary" onclick="downloadCsv()" style="display: none; margin-top: 20px;">📥 下載 CSV</button>
                <button id="downloadPlot" class="secondary" onclick="downloadPlot()" style="display: none;">📥 下載圖表 (PNG)</button>
            </div>
        </div>
    </div>

    <script>
        // Kyte-Doolittle Hydropathy Scale Values
        const KYTE_DOOLITTLE_SCALE = {
            'A': 1.8, 'R': -4.5, 'N': -3.5, 'D': -3.5, 'C': 2.5,
            'Q': -3.5, 'E': -3.5, 'G': -0.4, 'H': -3.2, 'I': 4.5,
            'L': 3.8, 'K': -3.9, 'M': 1.9, 'F': 2.8, 'P': -1.6,
            'S': -0.8, 'T': -0.7, 'W': -0.9, 'Y': -1.3, 'V': 4.2
        };

        // 監聽滑塊變化
        document.getElementById('windowSize').addEventListener('input', (e) => {
            document.getElementById('windowSizeValue').textContent = e.target.value;
        });

        document.getElementById('edgeWeight').addEventListener('input', (e) => {
            document.getElementById('edgeWeightValue').textContent = e.target.value + '%';
        });

        function validateSequence(seq) {
            return seq.toUpperCase().replace(/\s/g, '');
        }

        function isUniProtAC(id) {
            // Format: [A-Z][A-Z0-9]{5} (e.g., P12345)
            return /^[A-Z][A-Z0-9]{5}$/.test(id);
        }

        function isUniProtID(id) {
            // Format: NAME_ORGANISM (e.g., TP53_HUMAN)
            return /^[A-Z0-9]+_[A-Z0-9]+$/.test(id);
        }

        async function queryUniProtSequence(identifier) {
            try {
                const url = `https://rest.uniprot.org/uniprotkb/${identifier}.json`;
                const response = await fetch(url, {timeout: 10000});

                if (!response.ok) {
                    throw new Error(`UniProtKB 查詢失敗: ${response.status}`);
                }

                const data = await response.json();
                const sequence = data.sequence?.value;

                if (!sequence) {
                    throw new Error('找不到序列資料');
                }

                return sequence;
            } catch (error) {
                throw new Error(`UniProtKB 查詢錯誤: ${error.message}（確認帳號/ID 正確或檢查網路連線）`);
            }
        }

        function parseSequence(text) {
            const trimmed = text.trim();

            // Check if it's UniProtKB AC or ID
            if (isUniProtAC(trimmed) || isUniProtID(trimmed)) {
                return {type: 'uniprot', id: trimmed};
            }

            // FASTA format
            if (trimmed.startsWith('>')) {
                const lines = trimmed.split('\n');
                return {type: 'fasta', seq: validateSequence(lines.slice(1).join(''))};
            }

            // Raw sequence
            return {type: 'raw', seq: validateSequence(trimmed)};
        }

        function calculateHydropathyWindow(window, windowSize, edgeWeight, weightModel) {
            if (window.length !== windowSize) return 0;

            const scores = Array.from(window).map(aa => KYTE_DOOLITTLE_SCALE[aa] || 0);

            if (edgeWeight === 100) {
                return scores.reduce((a, b) => a + b, 0) / scores.length;
            }

            // Calculate weighted average
            const n = scores.length;
            const centerIdx = Math.floor(n / 2);
            const weights = [];

            for (let i = 0; i < n; i++) {
                const distFromCenter = Math.abs(i - centerIdx) / centerIdx;
                let w;
                if (weightModel === 'linear') {
                    w = 100 - (100 - edgeWeight) * distFromCenter;
                } else {
                    w = 100 - (100 - edgeWeight) * (distFromCenter * distFromCenter);
                }
                weights.push(w);
            }

            const totalWeight = weights.reduce((a, b) => a + b, 0);
            const normalizedWeights = weights.map(w => w / totalWeight);

            return scores.reduce((sum, score, i) => sum + score * normalizedWeights[i], 0);
        }

        function calculateHydropathy(sequence, windowSize, edgeWeight, weightModel, normalize) {
            const scores = [];
            const halfWindow = Math.floor(windowSize / 2);

            for (let i = 0; i < sequence.length; i++) {
                let start = Math.max(0, i - halfWindow);
                let end = Math.min(sequence.length, i + halfWindow + 1);
                let window = sequence.substring(start, end);

                // Pad if necessary
                if (window.length < windowSize) {
                    if (start === 0) {
                        window = 'X'.repeat(windowSize - window.length) + window;
                    } else {
                        window = window + 'X'.repeat(windowSize - window.length);
                    }
                }

                const score = calculateHydropathyWindow(window, windowSize, edgeWeight, weightModel);
                scores.push(score);
            }

            if (normalize && scores.length > 0) {
                const minScore = Math.min(...scores);
                const maxScore = Math.max(...scores);
                if (maxScore > minScore) {
                    return scores.map(s => (s - minScore) / (maxScore - minScore));
                }
            }

            return scores;
        }

        async function calculate() {
            const sequence = document.getElementById('sequence').value.trim();
            if (!sequence) {
                showError('請輸入蛋白質序列');
                return;
            }

            document.getElementById('calculateBtn').disabled = true;

            try {
                const parsed = parseSequence(sequence);
                let seq;

                // Handle UniProtKB lookup
                if (parsed.type === 'uniprot') {
                    showError('查詢 UniProtKB 中...');
                    try {
                        seq = await queryUniProtSequence(parsed.id);
                        hideError();
                    } catch (error) {
                        showError(error.message);
                        document.getElementById('calculateBtn').disabled = false;
                        return;
                    }
                } else {
                    seq = parsed.seq;
                }

                const windowSize = parseInt(document.getElementById('windowSize').value);
                const edgeWeight = parseFloat(document.getElementById('edgeWeight').value);
                const weightModel = document.getElementById('weightModel').value;
                const normalize = document.getElementById('normalize').checked;

                if (seq.length < windowSize) {
                    showError(`序列長度 ${seq.length} < 窗口大小 ${windowSize}`);
                    document.getElementById('calculateBtn').disabled = false;
                    return;
                }

                // Calculate
                const scores = calculateHydropathy(seq, windowSize, edgeWeight, weightModel, normalize);
                displayResults(seq, scores, windowSize, edgeWeight, weightModel, normalize);
                hideError();
            } catch (error) {
                showError(`錯誤：${error.message}`);
            } finally {
                document.getElementById('calculateBtn').disabled = false;
            }
        }

        function displayResults(sequence, scores, windowSize, edgeWeight, weightModel, normalize) {
            const positions = Array.from({length: scores.length}, (_, i) => i + 1);

            const trace = {
                x: positions,
                y: scores,
                type: 'scatter',
                mode: 'lines+markers',
                line: {color: '#667eea', width: 2},
                marker: {size: 4, opacity: 0.7},
                hovertemplate: '<b>位置</b>: %{x}<br><b>Score</b>: %{y:.3f}<extra></extra>'
            };

            const layout = {
                title: `Hydropathy Profile (Window: ${windowSize})`,
                xaxis: {title: '蛋白質位置 (Amino Acid Position)'},
                yaxis: {title: '疏水性指數 (Hydropathy Score)'},
                hovermode: 'x unified',
                plot_bgcolor: '#f8f9fa',
                margin: {l: 70, r: 30, t: 50, b: 60}
            };

            Plotly.newPlot('plot', [trace], layout, {responsive: true});

            // Stats
            const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
            const variance = scores.reduce((sum, score) => sum + Math.pow(score - mean, 2), 0) / scores.length;
            const std = Math.sqrt(variance);

            document.getElementById('stat-length').textContent = sequence.length;
            document.getElementById('stat-min').textContent = Math.min(...scores).toFixed(3);
            document.getElementById('stat-max').textContent = Math.max(...scores).toFixed(3);
            document.getElementById('stat-mean').textContent = mean.toFixed(3);
            document.getElementById('stat-std').textContent = std.toFixed(3);

            document.getElementById('stats').classList.add('show');
            document.getElementById('downloadCsv').style.display = 'block';
            document.getElementById('downloadPlot').style.display = 'block';

            // Store for download
            window.lastResult = {scores, positions, sequence};
        }

        function downloadCsv() {
            if (!window.lastResult) return;

            const {scores, positions} = window.lastResult;
            let csv = 'Position,Hydropathy Score\n';
            positions.forEach((pos, i) => {
                csv += `${pos},${scores[i].toFixed(6)}\n`;
            });

            const blob = new Blob([csv], {type: 'text/csv'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `hydropathy_${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function downloadPlot() {
            Plotly.downloadImage('plot', {
                format: 'png',
                width: 1200,
                height: 600,
                filename: 'hydropathy_plot'
            });
        }

        function showError(msg) {
            const errorEl = document.getElementById('error-msg');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }

        function hideError() {
            document.getElementById('error-msg').classList.remove('show');
        }

        function clearAll() {
            document.getElementById('sequence').value = '';
            document.getElementById('windowSize').value = '9';
            document.getElementById('windowSizeValue').textContent = '9';
            document.getElementById('edgeWeight').value = '100';
            document.getElementById('edgeWeightValue').textContent = '100%';
            document.getElementById('weightModel').value = 'linear';
            document.getElementById('normalize').checked = false;
            document.getElementById('stats').classList.remove('show');
            document.getElementById('downloadCsv').style.display = 'none';
            document.getElementById('downloadPlot').style.display = 'none';
            hideError();
            Plotly.purge('plot');
        }
    </script>
</body>
</html>
